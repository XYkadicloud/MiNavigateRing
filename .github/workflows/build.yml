name: Build APK + RPK

# 手机 APK 与手环 RPK 必须使用同一份签名证书（官方 interconnect 要求），
# 因此放在同一个 job 里：先生成签名，再依次编译，产物一起上传。
on:
  push:
    branches: [ google-maps, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # app/build.gradle.kts 的 generateDebugSigning 任务调用 `python`；
      # ubuntu runner 默认只有 python3，这里补一个别名。
      - name: Ensure `python` exists
        run: |
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -s "$(command -v python3)" /usr/local/bin/python
          fi
          python --version

      # 不用 android-actions/setup-android：它在某些 runner 上会卡在
      # sdkmanager --licenses 的交互式 (y/N) 提示里而失败。
      # ubuntu runner 已预装 SDK，但 sdkmanager 不一定在 PATH，这里用完整路径。
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-37" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" || true
            "$SM" --list_installed | head -60 || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 固定签名：优先用 secrets 里持久化的签名材料，保证每次构建证书一致。
      # 小米 SDK 会对调用方做 fingerprint 校验，证书一变就 "fingerprint verify failed"，
      # 所以绝不能每次构建随机生成。没有 secrets 时回退生成，并上传材料做首次引导。
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PROPERTIES_B64: ${{ secrets.SIGNING_PROPERTIES_B64 }}
          PRIVATE_PEM_B64: ${{ secrets.SIGNING_PRIVATE_PEM_B64 }}
          CERT_PEM_B64: ${{ secrets.SIGNING_CERT_PEM_B64 }}
        run: |
          mkdir -p app/signing
          if [ -n "$KEYSTORE_B64" ]; then
            echo "using persisted signing material from secrets"
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/signing/debug.jks
            printf '%s' "$PROPERTIES_B64" | base64 -d > app/signing/signing.local.properties
            printf '%s' "$PRIVATE_PEM_B64" | base64 -d > app/signing/private.pem
            printf '%s' "$CERT_PEM_B64" | base64 -d > app/signing/certificate.pem
          else
            echo "no signing secrets; generating fresh material (bootstrap)"
            python scripts/gen-debug-signing.py
          fi

      - name: Upload signing material (bootstrap only)
        uses: actions/upload-artifact@v4
        with:
          name: signing-material
          path: app/signing/
          if-no-files-found: warn

      # 小米官方 SDK 的 AAR 不随仓库分发。构建时从官方示例包取回，
      # 并用仓库自带的 check-aar-hash.py 校验 SHA256，通过后才编译。
      - name: Fetch + verify official Xiaomi AAR
        run: |
          curl -sL -o /tmp/demo.zip https://cdn.cnbj3-fusion.fds.api.mi-img.com/quickapp-vela/interconnect_dev_test_demo.zip
          echo "zip sha256: $(sha256sum /tmp/demo.zip | cut -d' ' -f1)"
          rm -rf /tmp/demo && mkdir -p /tmp/demo && unzip -oq /tmp/demo.zip -d /tmp/demo
          mkdir -p app/libs
          AAR="$(find /tmp/demo -name 'xms-wearable-lib_1.4_release.aar' | head -1)"
          echo "aar: $AAR"
          cp "$AAR" app/libs/
          python scripts/check-aar-hash.py

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Install band dependencies
        run: cd band-app && npm install

      - name: Build RPK
        run: node scripts/build-rpk.js

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload RPK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: band-rpk
          path: band-app/dist/*.rpk
          if-no-files-found: warn

name: Band RPK

on:
  push:
    branches: [ google-maps, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 (keytool for the debug cert)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure `python` exists
        run: |
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -s "$(command -v python3)" /usr/local/bin/python
          fi
          python --version

      # 手环 RPK 必须和手机端用同一份签名证书，所以先跑一次手机端的签名生成。
      - name: Generate debug signing material
        run: python scripts/gen-debug-signing.py

      - name: Install band dependencies
        run: cd band-app && npm install

      - name: Build RPK
        run: node scripts/build-rpk.js

      - name: Upload RPK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: band-rpk
          path: band-app/dist/*.rpk
          if-no-files-found: warn
